<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alea</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f7f7f8; color: #1a1a1a; margin: 0; padding: 32px 16px; }
    main { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font: inherit; }
    textarea { min-height: 120px; }
    button { margin-top: 20px; padding: 12px 20px; border: 0; border-radius: 8px; background: #1e1b4b; color: #fff; font: inherit; cursor: pointer; }
    #status { margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Alea</h1>
    <form id="form">
      <input type="hidden" name="access_key" value="cb9cae38-2855-4c99-b015-55d9ebd6472c">
      <input type="hidden" name="subject" value="Neue Antwort von Alea">
      <input type="checkbox" name="botcheck" style="display:none">

      <label for="name">Name</label>
      <input id="name" name="name" required>

      <label for="nachricht">Nachricht</label>
      <textarea id="nachricht" name="nachricht" required></textarea>

      <button type="submit">Absenden</button>
      <p id="status"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById('form');
    const status = document.getElementById('status');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.textContent = 'Wird gesendet …';
      try {
        const res = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Accept': 'application/json' },
          body: new FormData(form)
        });
        const data = await res.json();
        if (data.success) {
          form.reset();
          status.textContent = 'Danke! Deine Antwort wurde gesendet.';
        } else {
          status.textContent = 'Fehler: ' + data.message;
        }
      } catch {
        status.textContent = 'Senden fehlgeschlagen. Bitte später nochmals versuchen.';
      }
    });
  </script>
</body>
</html>
